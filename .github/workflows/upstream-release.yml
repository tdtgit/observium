name: weekly-release

on:
  schedule:
    - cron: '18 0 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: tuantuantuantuantuan/observium

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve upstream version
        id: tags
        run: |
          tar_args=(-xzOf - observium/includes/definitions/version.inc.php)
          if tar --help 2>&1 | grep -q -- '--fast-read'; then
            tar_args=(--fast-read "${tar_args[@]}")
          elif tar --help 2>&1 | grep -q -- '--occurrence'; then
            tar_args=(--occurrence=1 "${tar_args[@]}")
          fi

          version="$(
            curl -fsSL https://www.observium.org/observium-community-latest.tar.gz \
              | tar "${tar_args[@]}" \
              | awk -F"'" '/OBSERVIUM_VERSION_LONG/ {print $4; exit}'
          )"
          if [ -z "$version" ]; then
            echo "Failed to resolve Observium upstream version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if version exists on Docker Hub
        id: dockerhub
        run: |
          image_tag="${IMAGE_NAME}:${{ steps.tags.outputs.version }}"
          if docker manifest inspect "$image_tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub tag already exists: $image_tag"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub tag does not exist yet: $image_tag"
          fi

      - name: Decide publish behavior
        run: |
          echo "event=${{ github.event_name }}"
          echo "version=${{ steps.tags.outputs.version }}"
          echo "dockerhub_tag_exists=${{ steps.dockerhub.outputs.exists }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: build and push is forced."
          elif [ "${{ steps.dockerhub.outputs.exists }}" = "true" ]; then
            echo "Scheduled run: tag exists, skip build/push."
          else
            echo "Scheduled run: tag missing, build and push."
          fi

      - name: Build and push
        if: github.event_name == 'workflow_dispatch' || steps.dockerhub.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=weekly-release
          cache-to: type=gha,mode=max,scope=weekly-release
          build-args: |
            OBSERVIUM_DOWNLOAD_URL=https://www.observium.org/observium-community-latest.tar.gz
