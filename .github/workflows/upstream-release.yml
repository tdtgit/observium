name: weekly-release

on:
  schedule:
    - cron: '18 0 * * 5'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Override the release note body (markdown). Requires release_notes_reason.'
        required: false
        type: string
      release_notes_reason:
        description: 'Why the release note is overridden. Shown in the release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: tuantuantuantuantuan/observium
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_tag: ${{ steps.buildtag.outputs.tag }}
      dockerhub_tag_exists: ${{ steps.dockerhub.outputs.exists }}
      should_publish: ${{ steps.decision.outputs.should_publish }}
      decision_reason: ${{ steps.decision.outputs.reason }}

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve upstream version
        id: version
        run: |
          tar_args=(-xzOf - observium/includes/definitions/version.inc.php)
          if tar --help 2>&1 | grep -q -- '--fast-read'; then
            tar_args=(--fast-read "${tar_args[@]}")
          elif tar --help 2>&1 | grep -q -- '--occurrence'; then
            tar_args=(--occurrence=1 "${tar_args[@]}")
          fi

          version="$(
            curl -fsSL https://www.observium.org/observium-community-latest.tar.gz \
              | tar "${tar_args[@]}" \
              | awk -F"'" '/OBSERVIUM_VERSION_LONG/ {print $4; exit}'
          )"

          if [ -z "$version" ]; then
            echo "Failed to resolve Observium upstream version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if version exists on Docker Hub
        id: dockerhub
        run: |
          image_tag="${IMAGE_NAME}:${{ steps.version.outputs.version }}"
          if docker manifest inspect "$image_tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub tag already exists: $image_tag"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub tag does not exist yet: $image_tag"
          fi

      - name: Decide publish behavior
        id: decision
        run: |
          should_publish=false
          reason="scheduled-tag-exists"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_publish=true
            reason="manual-force"
          elif [ "${{ steps.dockerhub.outputs.exists }}" != "true" ]; then
            should_publish=true
            reason="scheduled-tag-missing"
          fi

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

          echo "event=${{ github.event_name }}"
          echo "version=${{ steps.version.outputs.version }}"
          echo "dockerhub_tag_exists=${{ steps.dockerhub.outputs.exists }}"
          echo "should_publish=$should_publish"
          echo "reason=$reason"

      - name: Resolve build tag
        id: buildtag
        if: steps.decision.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Releases are identified by build date, not by the upstream version,
          # so every publication is visible as new activity. A same-day repeat
          # gets a numeric suffix.
          base="$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; do
            n=$((n + 1))
            tag="${base}-${n}"
          done

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "build tag: ${tag}"

  build:
    runs-on: ubuntu-latest
    needs: release-gate
    if: needs.release-gate.outputs.should_publish == 'true'
    env:
      IMAGE_NAME: tuantuantuantuantuan/observium
      OBSERVIUM_DOWNLOAD_URL: https://www.observium.org/observium-community-latest.tar.gz
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_key: linux-amd64
            debian_arch: amd64
          - platform: linux/arm64
            platform_key: linux-arm64
            debian_arch: arm64
          - platform: linux/arm/v7
            platform_key: linux-arm-v7
            debian_arch: armhf

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve PHP version for ${{ matrix.platform }}
        id: phpver
        run: |
          version="$(scripts/sury-php-version.sh "${{ matrix.debian_arch }}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "PHP candidate for ${{ matrix.debian_arch }}: ${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=weekly-release-${{ matrix.platform_key }}
          cache-to: type=gha,mode=max,scope=weekly-release-${{ matrix.platform_key }}
          build-args: |
            OBSERVIUM_DOWNLOAD_URL=${{ env.OBSERVIUM_DOWNLOAD_URL }}
            PHP_VERSION=${{ steps.phpver.outputs.version }}

      - name: Verify PHP version in built image
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PHP_VERSION: ${{ steps.phpver.outputs.version }}
        run: |
          set -euo pipefail

          actual="$(docker run --rm --platform "${PLATFORM}" --entrypoint dpkg-query \
            "${IMAGE_NAME}@${IMAGE_DIGEST}" -W -f='${Version}' php8.5-cli)"

          echo "label:  ${PHP_VERSION}"
          echo "actual: ${actual}"

          if [ "${actual}" != "${PHP_VERSION}" ]; then
            echo "::error::PHP version mismatch: image has ${actual}, label says ${PHP_VERSION}"
            exit 1
          fi

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Resolve compressed image size (${{ matrix.platform }})
        id: size
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          # Manifest architecture for linux/arm/v7 is "arm", with variant "v7".
          platform="${PLATFORM#linux/}"
          arch="${platform%%/*}"
          variant=""
          case "${platform}" in
            */*) variant="${platform#*/}" ;;
          esac
          image="${IMAGE_NAME}@${IMAGE_DIGEST}"

          # build-push-action publishes an index containing the platform
          # manifest and an attestation manifest. Select the platform one.
          manifest="$(docker buildx imagetools inspect --format '{{json .}}' "${image}" \
            | python3 -c '
          import json, sys
          want, want_variant = sys.argv[1], sys.argv[2]
          manifest = json.load(sys.stdin)["manifest"]
          children = manifest.get("manifests")
          if not children:
              print(manifest["digest"])
              raise SystemExit(0)
          for child in children:
              platform = child.get("platform") or {}
              annotations = child.get("annotations") or {}
              if platform.get("architecture") != want:
                  continue
              # Only constrain the variant when the manifest records one; a
              # missing variant is the only variant built for that architecture.
              if want_variant and (platform.get("variant") or want_variant) != want_variant:
                  continue
              if annotations.get("vnd.docker.reference.type"):
                  continue
              print(child["digest"])
              break
          else:
              raise SystemExit(f"no manifest for {want}/{want_variant}")
          ' "${arch}" "${variant}")"

          bytes="$(docker buildx imagetools inspect --raw "${IMAGE_NAME}@${manifest}" \
            | python3 -c 'import json, sys; print(sum(layer.get("size", 0) for layer in json.load(sys.stdin).get("layers", [])))')"
          human="$(python3 -c 'import sys; print(f"{int(sys.argv[1]) / 1000000:.2f} MB")' "${bytes}")"

          echo "Compressed size: ${human} (${bytes} bytes)"
          echo "human=${human}" >> "$GITHUB_OUTPUT"

      - name: Export image info
        run: |
          mkdir -p /tmp/image-info
          {
            printf 'platform=%s\n' "${{ matrix.platform }}"
            printf 'php-version=%s\n' "${{ steps.phpver.outputs.version }}"
            printf 'digest=%s\n' "${{ steps.build.outputs.digest }}"
            printf 'size=%s\n' "${{ steps.size.outputs.human }}"
          } > "/tmp/image-info/${{ matrix.platform_key }}.info"

      - name: Upload image info artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-info-${{ matrix.platform_key }}
          path: /tmp/image-info/*
          if-no-files-found: error
          retention-days: 1

  push:
    runs-on: ubuntu-latest
    needs:
      - release-gate
      - build
    if: needs.release-gate.outputs.should_publish == 'true'
    outputs:
      manifest_digest: ${{ steps.inspect.outputs.digest }}
    env:
      IMAGE_NAME: tuantuantuantuantuan/observium

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail

          digests=()
          for digest_file in *; do
            digests+=("${IMAGE_NAME}@sha256:${digest_file}")
          done

          docker buildx imagetools create \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:${{ needs.release-gate.outputs.version }}" \
            -t "${IMAGE_NAME}:${{ needs.release-gate.outputs.build_tag }}" \
            "${digests[@]}"

      - name: Inspect pushed image
        id: inspect
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "${IMAGE_NAME}:${{ needs.release-gate.outputs.version }}")"
          printf '%s\n' "${inspect}"
          digest="$(printf '%s\n' "${inspect}" | awk '/^Digest:/ && !d { print $2; d = 1 }')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "multi-arch manifest digest: ${digest}"

  github-release:
    runs-on: ubuntu-latest
    needs:
      - release-gate
      - push
    if: needs.release-gate.outputs.should_publish == 'true'
    # Creating the release also creates its tag. GitHub will not create a tag
    # pointing at a commit that changes .github/workflows/ unless the token
    # carries the `workflows` scope, which the GITHUB_TOKEN cannot be granted.
    # Set RELEASE_TOKEN (fine-grained PAT with contents+workflows write) to
    # cover those commits; otherwise the GITHUB_TOKEN is used and releases from
    # workflow-changing commits are refused by the API.
    permissions:
      contents: write
    env:
      IMAGE_NAME: tuantuantuantuantuan/observium
      VERSION: ${{ needs.release-gate.outputs.version }}
      BUILD_TAG: ${{ needs.release-gate.outputs.build_tag }}
      MANIFEST_DIGEST: ${{ needs.push.outputs.manifest_digest }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      RELEASE_NOTES_REASON: ${{ inputs.release_notes_reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Download image info
        uses: actions/download-artifact@v8
        with:
          path: /tmp/image-info
          pattern: image-info-*
          merge-multiple: true

      - name: Read component versions from the published image
        run: |
          set -euo pipefail
          mkdir -p /tmp/published

          for info in /tmp/image-info/*.info; do
            [ -e "${info}" ] || continue
            key="$(basename "${info}" .info)"
            platform="$(awk -F= '/^platform=/{print $2}' "${info}")"
            if [ -z "${platform}" ]; then
              # Fall back to the artifact name (linux-amd64 -> linux/amd64).
              platform="$(printf '%s' "${key}" | sed 's|^linux-|linux/|')"
            fi
            digest="$(awk -F= '/^digest=/{print $2}' "${info}")"
            [ -n "${digest}" ] || continue

            echo "Reading /etc/php-version from ${IMAGE_NAME}@${digest} (${platform})"
            published="$(docker run --rm --platform "${platform}" --entrypoint cat \
              "${IMAGE_NAME}@${digest}" /etc/php-version 2>/dev/null || true)"
            if [ -z "${published}" ]; then
              # Images built before /etc/php-version was introduced.
              published="$(docker run --rm --platform "${platform}" --entrypoint dpkg-query \
                "${IMAGE_NAME}@${digest}" -W -f='${Version}' php8.5-cli)"
            fi

            expected="$(awk -F= '/^php-version=/{print $2}' "${info}")"
            if [ "${published}" != "${expected}" ]; then
              echo "::error::published image reports PHP ${published} but the build recorded ${expected}"
              exit 1
            fi

            printf '%s\n' "${published}" > "/tmp/published/${key}.php"

            echo "Reading /etc/observium-components from ${IMAGE_NAME}@${digest} (${platform})"
            components="$(docker run --rm --platform "${platform}" --entrypoint cat \
              "${IMAGE_NAME}@${digest}" /etc/observium-components 2>/dev/null || true)"
            if [ -n "${components}" ]; then
              printf '%s\n' "${components}" > "/tmp/published/${key}.components"
            else
              # Images built before /etc/observium-components was introduced.
              echo "No /etc/observium-components in the published image; the note falls back to PHP only."
            fi
          done

          cat /tmp/published/*.php || true
          cat /tmp/published/*.components 2>/dev/null || true

      - name: Create GitHub release
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = process.env.VERSION;
            const imageName = process.env.IMAGE_NAME;
            const buildTag = process.env.BUILD_TAG || new Date().toISOString().slice(0, 10).replace(/-/g, '.');
            const manifestDigest = process.env.MANIFEST_DIGEST || '';
            const releaseName = `Observium ${version} · ${buildTag}`;

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Override sources, in order of precedence:
            //   1. the workflow_dispatch input (ad-hoc, one run)
            //   2. release-notes/<observium-version>.md in the repository (durable, in git)
            // Every publication creates a new date-tagged release, so an override
            // never needs to survive a rebuild of the same release.
            let note = '';
            let reason = '';
            let source = '';

            const dispatchNote = (process.env.RELEASE_NOTES || '').trim();
            const dispatchReason = (process.env.RELEASE_NOTES_REASON || '').trim();

            const overrideFile = path.join(process.env.GITHUB_WORKSPACE || '/tmp', 'release-notes', `${version}.md`);
            let fileNote = '';
            let fileReason = '';
            if (fs.existsSync(overrideFile)) {
              let raw = fs.readFileSync(overrideFile, 'utf8');
              const frontMatter = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
              if (frontMatter) {
                const match = frontMatter[1].match(/^reason:\s*(.*)$/m);
                if (match) fileReason = match[1].trim();
                raw = raw.slice(frontMatter[0].length);
              }
              fileNote = raw.trim();
            }

            if (dispatchNote) {
              note = dispatchNote;
              reason = dispatchReason || fileReason;
              source = 'workflow_dispatch input';
            } else if (fileNote) {
              note = fileNote;
              reason = fileReason;
              source = `release-notes/${version}.md`;
            }

            if (note && !reason) {
              core.setFailed('A release note override requires a reason: set release_notes_reason, or add "reason:" to the front matter of the override file.');
              return;
            }
            if (note) {
              core.info(`Using release note override from ${source} (${reason})`);
              if (source === 'workflow_dispatch input') {
                core.warning('This override was passed as a workflow input. It is carried forward into the published release, but commit it to release-notes/<version>.md so it is reviewable in git.');
              }
            }

            // Component versions and per-platform digest, read from the
            // published image. PHP is just one component among them.
            const componentLabels = {
              'debian': 'Debian',
              'nginx': 'Nginx',
              'php8.5-cli': 'PHP CLI',
              'php8.5-fpm': 'PHP-FPM',
              'php8.5-apcu': 'APCu',
              'mariadb-client': 'MariaDB client',
              'rrdtool': 'RRDtool',
              'snmp': 'Net-SNMP',
              'fping': 'fping',
              'graphviz': 'Graphviz',
              'imagemagick': 'ImageMagick',
              'mtr-tiny': 'mtr',
              'ipmitool': 'ipmitool',
              'libvirt-clients': 'libvirt client',
              'whois': 'whois'
            };

            const infoDir = '/tmp/image-info';
            const rows = [];
            if (fs.existsSync(infoDir)) {
              for (const file of fs.readdirSync(infoDir).sort()) {
                if (!file.endsWith('.info')) continue;
                const content = fs.readFileSync(path.join(infoDir, file), 'utf8');
                const platform = (content.match(/^platform=(.*)$/m) || [])[1] ||
                  file.replace(/\.info$/, '').replace('linux-', 'linux/');
                const phpVersion = (content.match(/^php-version=(.*)$/m) || [])[1] || '';
                const digest = (content.match(/^digest=(.*)$/m) || [])[1] || '';
                const size = (content.match(/^size=(.*)$/m) || [])[1] || '';
                const publishedFile = `/tmp/published/${file.replace(/\.info$/, '')}.php`;
                const published = (fs.existsSync(publishedFile)
                  ? fs.readFileSync(publishedFile, 'utf8').trim()
                  : '').replace(/^php-version=/, '');
                const componentsFile = `/tmp/published/${file.replace(/\.info$/, '')}.components`;
                const hasComponents = fs.existsSync(componentsFile);
                const php = published || phpVersion;
                const components = hasComponents
                  ? fs.readFileSync(componentsFile, 'utf8').trim().split('\n').filter(Boolean).map((line) => {
                      const [name, ...version] = line.split('\t');
                      return { name, version: version.join('\t') };
                    })
                  : php ? [{ name: 'php8.5-cli', version: php }] : [];
                rows.push({ platform, phpVersion: published || phpVersion, digest, size, components, hasComponents });
              }
            }
            const phpVersions = rows.map((row) => row.phpVersion);
            const phpUniform = phpVersions.length > 0 && phpVersions.every((v) => v === phpVersions[0]);

            const lines = [
              `Observium **${version}** · build **${buildTag}**`,
              ''
            ];

            if (note) {
              lines.push(
                '## Release notes',
                '',
                note,
                '',
                `> **Why this release is not the usual automated one:** ${reason}`,
                ''
              );
            }

            lines.push(
              '## Image',
              '',
              `Published to [Docker Hub](https://hub.docker.com/r/${imageName}).`,
              ''
            );
            if (manifestDigest) {
              lines.push(`Multi-arch digest: \`${manifestDigest}\``, '');
            }
            if (rows.length > 0) {
              lines.push(
                '| Platform | Image digest | Compressed size |',
                '| --- | --- | --- |',
                ...rows.map((row) => `| \`${row.platform}\` | \`${row.digest}\` | ${row.size || '—'} |`),
                ''
              );
            }
            lines.push(
              '| Tag | Type |',
              '| --- | --- |',
              `| \`${buildTag}\` | immutable, one per build |`,
              `| \`${version}\` | current Observium version, moves on rebuild |`,
              '| `latest` | rolling |',
              '',
              '```bash',
              `docker pull ${imageName}:${buildTag}`,
              `docker pull ${imageName}:latest`,
              '```'
            );

            if (rows.length > 0) {
              const archColumns = rows.map((row) => `\`${row.platform}\``);
              const componentNames = [];
              for (const row of rows) {
                for (const component of row.components) {
                  if (!componentNames.includes(component.name)) componentNames.push(component.name);
                }
              }
              const labelOrder = Object.keys(componentLabels);
              componentNames.sort((a, b) => {
                const ia = labelOrder.indexOf(a);
                const ib = labelOrder.indexOf(b);
                return (ia === -1 ? labelOrder.length : ia) - (ib === -1 ? labelOrder.length : ib);
              });
              const cell = (row, name) => {
                const component = row.components.find((item) => item.name === name);
                return component ? `\`${component.version}\`` : '—';
              };
              const inspectCommands = rows.every((row) => row.hasComponents)
                ? [
                    `docker run --rm --entrypoint cat ${imageName}:${buildTag} /etc/observium-components`,
                    'docker compose exec observium cat /etc/observium-components'
                  ]
                : [
                    `docker run --rm --entrypoint php ${imageName}:${buildTag} -v`,
                    'docker compose exec observium php -v'
                  ];

              lines.push(
                '',
                '## Installed components',
                '',
                `| Component | ${archColumns.join(' | ')} |`,
                `| --- | ${rows.map(() => '---').join(' | ')} |`,
                ...componentNames.map((name) => `| ${componentLabels[name] || name} | ` +
                  `${rows.map((row) => cell(row, name)).join(' | ')} |`),
                ''
              );
              if (!phpUniform) {
                lines.push(
                  '> The PHP repository publishes each architecture independently, so the platforms can ' +
                    'differ by one patch release for a short period after an upstream release. The image is ' +
                    'rebuilt automatically once the slower architecture catches up.',
                  ''
                );
              }
              lines.push(
                'Check the versions in your deployment:',
                '',
                '```bash',
                ...inspectCommands,
                '```'
              );
            }

            const body = lines.join('\n');

            // Create the release for this build tag, or update it when the job is
            // re-run for the same tag (a failed release step must not produce a
            // duplicate 2026.10.22-2 pointing at the same image). The Docker tag
            // is last-write-wins in the same way, so both converge.
            let release;
            try {
              release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: buildTag,
                target_commitish: context.sha,
                name: releaseName,
                body,
                draft: false,
                prerelease: false,
                generate_release_notes: false
              });
              core.info(`Created release ${buildTag} for Observium ${version}`);
            } catch (error) {
              if (error.status === 403) {
                core.setFailed(
                  `Cannot create the release tag ${buildTag}: the token is not allowed to tag a commit that ` +
                    `changes .github/workflows/. Add a fine-grained personal access token with contents:write ` +
                    `and workflows:write as the RELEASE_TOKEN secret, or publish this release from a commit that ` +
                    `does not modify workflow files.`
                );
                return;
              }
              if (error.status !== 422) throw error;
              const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag: buildTag });
              release = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existing.data.id,
                tag_name: buildTag,
                target_commitish: context.sha,
                name: releaseName,
                body,
                draft: false,
                prerelease: false
              });
              core.info(`Updated existing release ${buildTag} for Observium ${version}`);
            }

            core.setOutput('release_url', release.data.html_url);

  summary:
    runs-on: ubuntu-latest
    needs:
      - release-gate
      - build
      - push
      - github-release
    if: always()

    steps:
      - name: Print release decision summary
        run: |
          echo "event=${{ github.event_name }}"
          echo "version=${{ needs.release-gate.outputs.version }}"
          echo "build_tag=${{ needs.release-gate.outputs.build_tag }}"
          echo "dockerhub_tag_exists=${{ needs.release-gate.outputs.dockerhub_tag_exists }}"
          echo "should_publish=${{ needs.release-gate.outputs.should_publish }}"
          echo "decision_reason=${{ needs.release-gate.outputs.decision_reason }}"
          echo "build_job_result=${{ needs.build.result }}"
          echo "push_job_result=${{ needs.push.result }}"
          echo "github_release_job_result=${{ needs.github-release.result }}"
