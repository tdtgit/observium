name: Feature request
description: Propose a change to the Docker image, the compose.yaml stack, or the container scripts.
body:
  - type: markdown
    attributes:
      value: |
        Use this form for changes to the packaging: the `Dockerfile`,
        `compose.yaml`, the entrypoint scripts, the release automation, or the
        documentation in this repository.

        Features of the Observium application itself belong upstream:
        <https://www.observium.org>

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible to do today? Describe the situation you are in, not only the solution you have in mind.
      placeholder: "Running the stack behind a reverse proxy requires ... which the image does not support."
    validations:
      required: true

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: What should the repository do instead? Mention the file it would touch if you know (Dockerfile, compose.yaml, docker/entrypoint.sh, a workflow).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, including the workaround you use today (a compose.override.yaml, a derived image, an environment variable).
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact on the image size or boot time
      description: |
        Does the change add packages or build steps, or work at container
        start? Say "none" if the image size, build time, and boot time are
        unaffected.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, upstream references, or example configuration.
    validations:
      required: false
