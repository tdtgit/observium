name: image-scan

# Trivy scan of the published image (weekly, report only) and of pull request
# builds (fails only on fixable CRITICAL findings). Like pull-request.yml this
# builds the contributor's Dockerfile, so it uses pull_request and never
# pull_request_target: no repository secrets, read-only token on forks.
on:
  schedule:
    # Fridays 07:00 UTC = 14:00 VNT, after the Friday 00:18 UTC release build.
    - cron: '0 7 * * 5'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: image-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PUBLISHED_IMAGE: tuantuantuantuantuan/observium:latest
  # Pinned so a scan result does not move with the action's default.
  TRIVY_VERSION: v0.76.1

jobs:
  published-image:
    name: Scan the published image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan ${{ env.PUBLISHED_IMAGE }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # amd64 only: findings limited to other architectures are not seen.
          image-ref: ${{ env.PUBLISHED_IMAGE }}
          scan-type: image
          # vuln only: the secret scanner flags key-shaped text in upstream MIBs.
          scanners: vuln
          format: sarif
          output: trivy-published.sarif
          exit-code: '0'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          version: ${{ env.TRIVY_VERSION }}

      - name: Upload results to code scanning
        if: always() && hashFiles('trivy-published.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-published.sarif
          category: trivy-published-image

      - name: Summarise findings
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Image scan: \`${PUBLISHED_IMAGE}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s trivy-published.sarif ]; then
            echo "No SARIF report was produced; see the scan step above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total="$(jq '[.runs[]?.results[]?] | length' trivy-published.sarif)"
          {
            echo "This run is report-only and never fails on findings."
            echo
            echo "| Level | Findings |"
            echo "| --- | --- |"
            jq -r '
              [.runs[]?.results[]? | (.level // "unknown")] | group_by(.)[]
              | "| \(.[0]) | \(length) |"
            ' trivy-published.sarif
            echo
            echo "Total: \`${total}\` finding(s). Details are in the Security tab (code scanning, category \`trivy-published-image\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  pull-request:
    name: Scan the pull request build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --pull -t observium:scan .

      - name: Scan observium:scan
        id: scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: observium:scan
          scan-type: image
          # vuln only: the secret scanner flags key-shaped text in upstream MIBs.
          scanners: vuln
          format: sarif
          output: trivy-pr.sarif
          # Gate: CRITICAL with a fix. The report is written before the
          # non-zero exit, so everything is still uploaded below.
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          version: ${{ env.TRIVY_VERSION }}

      - name: Upload results to code scanning
        if: always() && hashFiles('trivy-pr.sarif') != ''
        # Refused on fork PRs (read-only token); the scan step is the gate.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-pr.sarif
          category: trivy-pr-image

      - name: Summarise findings
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Pull request image scan"
            echo
            echo "Gate: CRITICAL findings with a fix available."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s trivy-pr.sarif ]; then
            echo "No SARIF report was produced; see the scan step above." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -r '
            [.runs[]?.results[]?] as $results
            | if ($results | length) == 0 then
                "No fixable CRITICAL findings."
              else
                ("| Vulnerability | Package / target | Severity score |",
                 "| --- | --- | --- |",
                 ($results[0:25][]
                   | "| \(.ruleId) | \(.locations[0]?.physicalLocation?.artifactLocation?.uri // "unknown") | \(.properties["security-severity"] // "-") |"),
                 "",
                 "Total: \($results | length) finding(s); the full list is in the Security tab (code scanning, category `trivy-pr-image`).")
              end
          ' trivy-pr.sarif >> "$GITHUB_STEP_SUMMARY" || true
