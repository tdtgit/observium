name: pull-request

on:
  pull_request:
    types: [opened, synchronize, reopened]

# SECURITY: this workflow runs the contributor's Dockerfile, docker/ scripts and
# compose.yaml, which is arbitrary code execution. It deliberately uses
# `pull_request`, never `pull_request_target`: pull requests from forks then get
# a read-only GITHUB_TOKEN and no repository secrets.
#
# Do not add secrets to this workflow, do not push anything, and do not move it
# to a self-hosted runner.
permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Text-only checks: shell syntax, ShellCheck, actionlint, YAML parsing and
  # `docker compose config`. Cheap (seconds), so it runs before the image build
  # and fails fast. It still executes the contributor's own
  # scripts/check-static.sh, so it inherits exactly the trust model of the
  # build job below: pull_request, read-only token, no secrets, GitHub-hosted
  # ephemeral runner. Nothing here needs a secret or a registry login.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run scripts/check-static.sh
        # ShellCheck is preinstalled on the runner. actionlint is not, so the
        # script downloads the pinned release below into a temp directory (and
        # removes it again) instead of a marketplace action.
        env:
          ACTIONLINT_VERSION: 1.7.7
          SHELLCHECK_SEVERITY: warning
        run: scripts/check-static.sh

  verify:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Keep the token out of .git/config, which the build and the
          # container scripts can read. The token is read-only, but it does
          # not need to be reachable at all.
          persist-credentials: false

      # Deliberately no OBSERVIUM_VERSION build arg: a pull request build is
      # not a release, so the image is left unstamped (org.observium.version is
      # empty and /etc/observium-components has no observium line) rather than
      # claiming a version nobody resolved. Only upstream-release.yml passes the
      # upstream version it read from the tarball.
      - name: Build the image
        run: docker build -t observium:pr .

      - name: Boot the stack with Compose
        # Starts from an empty database and fails on a restart, an ERROR in the
        # entrypoint log, an incomplete schema, a broken login, or a
        # non-idempotent second start. See scripts/smoke-compose.sh.
        run: scripts/smoke-compose.sh observium:pr

      - name: Write summary
        if: always()
        run: |
          {
            echo "### Compose smoke test"
            echo
            echo "Image: \`observium:pr\` built from \`${{ github.event.pull_request.head.sha }}\`"
            echo
            echo "Result: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
