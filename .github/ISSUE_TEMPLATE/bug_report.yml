name: Bug report
description: Report a problem with the image, the compose.yaml stack, or a container script.
body:
  - type: markdown
    attributes:
      value: |
        This repository packages Observium Community Edition as a Docker image.
        Bugs in the Observium application itself belong upstream:
        <https://www.observium.org>

        Do not report security problems in a public issue. Use the private
        advisory link on the new-issue page.

        Test the current `:latest` image before you report. Fill in every
        required field. A report without versions and logs cannot be
        reproduced.

  - type: input
    id: image-ref
    attributes:
      label: Image tag or digest
      description: |
        The exact image you ran. A tag can point to a different build later, so
        a digest is better. With the stack running:
        `docker inspect --format '{{index .RepoDigests 0}}' $(docker compose ps -q observium)`
      placeholder: "tuantuantuantuantuan/observium@sha256:..."
    validations:
      required: true

  - type: input
    id: host-os-arch
    attributes:
      label: Host OS and architecture
      description: The operating system, its version, and the CPU architecture. The output of `uname -sm` helps.
      placeholder: "Debian 13 (trixie), linux/amd64"
    validations:
      required: true

  - type: input
    id: docker-version
    attributes:
      label: Docker version
      description: "The output of `docker version --format '{{.Server.Version}}'`."
      placeholder: "27.3.1"
    validations:
      required: true

  - type: input
    id: compose-version
    attributes:
      label: Docker Compose version
      description: "The output of `docker compose version`. Compose v1 is not supported."
      placeholder: "Docker Compose version v2.29.7"
    validations:
      required: true

  - type: textarea
    id: compose-config
    attributes:
      label: Resolved Compose configuration
      description: |
        The output of `docker compose config`, run in the directory you started
        the stack from. It shows the defaults and environment values that were
        applied.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Container logs
      description: |
        The output of `docker compose logs --no-log-prefix`. Include the start
        of the log. The entrypoint reports the schema import and the container
        setup there.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected and actual behaviour
      description: What you expected, what happened instead, and the steps that reproduce it.
      placeholder: |
        Steps to reproduce:
        1. docker compose up -d
        2. ...

        Expected:

        Actual:
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Changes you made to compose.yaml, values from .env, or whether ./data was created by an older image.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This reproduces with the current `:latest` image, or I explained above why I cannot test it.
          required: true
        - label: This is a problem with the Docker packaging, not with the Observium application.
          required: true
