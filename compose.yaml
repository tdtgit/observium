services:
  db:
    # Override to pin the database image, e.g. MARIADB_IMAGE=mariadb:11.4.5 in
    # .env, so a deployment does not move when the mariadb:11 tag is updated.
    image: ${MARIADB_IMAGE:-mariadb:11}
    restart: unless-stopped
    # Observium's initial schema uses mixed case table names (bgpPeers,
    # entPhysical, ...). With lower_case_table_names=2 (the MariaDB default on
    # case insensitive filesystems) an ALTER TABLE on such a table leaves it
    # unreachable and the schema import stops before devices.device_id gets
    # AUTO_INCREMENT, which breaks adding more than one device. The mode can
    # only be chosen while the data directory is created, so db-entrypoint.sh
    # picks it before the data directory is initialised.
    entrypoint:
      - /bin/sh
      - /opt/observium-db/db-entrypoint.sh
      - docker-entrypoint.sh
    command:
      - mariadbd
      - ${MARIADB_BINLOG_OPTION:---skip-log-bin}
    environment:
      MARIADB_DATABASE: observium
      MARIADB_USER: observium
      MARIADB_PASSWORD: observium
      MARIADB_ROOT_PASSWORD: observium-root
      # Optional: force lower_case_table_names (0, 1 or 2) instead of the
      # mode chosen by db-entrypoint.sh. Only useful for an existing data
      # directory, see the database notes in the README.
      OBSERVIUM_DB_LOWER_CASE_TABLE_NAMES: ${OBSERVIUM_DB_LOWER_CASE_TABLE_NAMES:-}
    volumes:
      - ./data/db:/var/lib/mysql
      - ./docker/db-entrypoint.sh:/opt/observium-db/db-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-uroot", "-pobservium-root"]
      interval: 10s
      timeout: 5s
      retries: 10

  observium:
    image: ${OBSERVIUM_IMAGE:-tuantuantuantuantuan/observium}
    restart: unless-stopped
    shm_size: ${OBSERVIUM_SHM_SIZE:-256m}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${OBSERVIUM_HTTP_PORT:-8080}:80"
    environment:
      OBSERVIUM_DB_HOST: ${OBSERVIUM_DB_HOST:-db}
      OBSERVIUM_DB_NAME: ${OBSERVIUM_DB_NAME:-observium}
      OBSERVIUM_DB_USER: ${OBSERVIUM_DB_USER:-observium}
      OBSERVIUM_DB_PASSWORD: ${OBSERVIUM_DB_PASSWORD:-observium}
      OBSERVIUM_INIT_DB_SCHEMA: ${OBSERVIUM_INIT_DB_SCHEMA:-true}
      OBSERVIUM_CREATE_ADMIN: ${OBSERVIUM_CREATE_ADMIN:-true}
      OBSERVIUM_ADMIN_USER: ${OBSERVIUM_ADMIN_USER:-admin}
      # Empty means "generate one": no well-known default. The dash (no colon)
      # keeps an explicitly empty value empty instead of substituting a default.
      OBSERVIUM_ADMIN_PASSWORD: ${OBSERVIUM_ADMIN_PASSWORD-}
      OBSERVIUM_ADMIN_LEVEL: ${OBSERVIUM_ADMIN_LEVEL:-10}
      OBSERVIUM_ENABLE_CRON: ${OBSERVIUM_ENABLE_CRON:-true}
      OBSERVIUM_ENABLE_FASTCACHE: ${OBSERVIUM_ENABLE_FASTCACHE:-true}
      OBSERVIUM_CACHE_DRIVER: ${OBSERVIUM_CACHE_DRIVER:-apcu}
      OBSERVIUM_PHP_MEMORY_LIMIT: ${OBSERVIUM_PHP_MEMORY_LIMIT:-512M}
      OBSERVIUM_APCU_SHM_SIZE: ${OBSERVIUM_APCU_SHM_SIZE:-128M}
      OBSERVIUM_ENABLE_RAMDISK: ${OBSERVIUM_ENABLE_RAMDISK:-false}
      OBSERVIUM_RAMDISK_PATH: ${OBSERVIUM_RAMDISK_PATH:-/dev/shm/observium-rrd}
      OBSERVIUM_RAMDISK_SYNC_INTERVAL: ${OBSERVIUM_RAMDISK_SYNC_INTERVAL:-300}
    volumes:
      - ./data/rrd:/opt/observium/rrd
      - ./data/logs:/opt/observium/logs
