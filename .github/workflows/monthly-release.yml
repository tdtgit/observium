name: monthly-release

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/monthly-release.yml

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: tuantuantuantuantuan/observium

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve upstream version
        id: tags
        run: |
          tar_args=(-xzOf - observium/includes/definitions/version.inc.php)
          if tar --help 2>&1 | grep -q -- '--fast-read'; then
            tar_args=(--fast-read "${tar_args[@]}")
          elif tar --help 2>&1 | grep -q -- '--occurrence'; then
            tar_args=(--occurrence=1 "${tar_args[@]}")
          fi

          version="$(
            curl -fsSL https://www.observium.org/observium-community-latest.tar.gz \
              | tar "${tar_args[@]}" \
              | awk -F"'" '/OBSERVIUM_VERSION_LONG/ {print $4; exit}'
          )"
          if [ -z "$version" ]; then
            echo "Failed to resolve Observium upstream version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=monthly-release
          cache-to: type=gha,mode=max,scope=monthly-release
          build-args: |
            OBSERVIUM_DOWNLOAD_URL=https://www.observium.org/observium-community-latest.tar.gz
