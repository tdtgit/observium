name: php-refresh

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  IMAGE_NAME: tuantuantuantuantuan/observium

jobs:
  check:
    name: Compare published PHP version with sury candidates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compare published image with sury candidates
        id: compare
        run: |
          set -euo pipefail

          labels="$(python3 scripts/image-php-labels.py "${IMAGE_NAME}" latest org.observium.php.version)"
          echo "Published ${IMAGE_NAME}:latest"
          echo "${labels}"
          echo

          # linux/arm/v7 is recorded as "arm" in the image index.
          behind="false"
          for pair in amd64:amd64 arm64:arm64 armhf:arm; do
            debian_arch="${pair%%:*}"
            image_arch="${pair##*:}"
            candidate="$(scripts/sury-php-version.sh "${debian_arch}")"
            published="$(printf '%s\n' "${labels}" | awk -v a="${image_arch}" '$1 == a { print $2 }')"
            if [ "${published}" = "${candidate}" ]; then
              echo "${debian_arch}: up to date (${candidate})"
            else
              behind="true"
              echo "${debian_arch}: behind (published=${published:-<none>} candidate=${candidate})"
            fi
          done

          echo "behind=${behind}" >> "$GITHUB_OUTPUT"

      - name: Write summary
        run: |
          {
            echo "### PHP refresh check"
            echo
            echo "Image: \`${IMAGE_NAME}:latest\`"
            echo
            echo "Behind: \`${{ steps.compare.outputs.behind }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for an in-progress release build
        id: running
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow upstream-release.yml --status in_progress --limit 5 \
            --json databaseId --jq 'length')"
          echo "in_progress=${count}" >> "$GITHUB_OUTPUT"
          echo "release builds in progress: ${count}"

      - name: Trigger release rebuild
        if: steps.compare.outputs.behind == 'true' && steps.running.outputs.in_progress == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "Published image is behind the sury candidates; rebuilding."
          if [ -n "${DEFAULT_BRANCH}" ]; then
            gh workflow run upstream-release.yml --repo "${GITHUB_REPOSITORY}" --ref "${DEFAULT_BRANCH}"
          else
            gh workflow run upstream-release.yml --repo "${GITHUB_REPOSITORY}"
          fi
